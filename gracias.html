<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gracias · Slumen</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Mulish:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="css/pago.css">
<style>.nota-wa{flex-basis:100%;margin:2px 0 4px;font-size:14px;opacity:.8}</style>
</head>
<body>

<header class="cabecera">
  <div class="envoltura">
    <a href="index.html" aria-label="Slumen, inicio"><img src="img/nombre.png" alt="Slumen" width="372" height="92"></a>
  </div>
</header>

<main class="gracias" id="gracias" data-estado="verificando">
  <div class="envoltura" style="display:grid;place-items:center">
    <div class="tarjeta" role="status" aria-live="polite">
      <div class="sol" aria-hidden="true"></div>
      <span class="etiqueta" id="etiqueta"></span>
      <h1 id="titulo"></h1>
      <p id="texto"></p>
      <div class="acciones" id="acciones"></div>
    </div>
  </div>
</main>

<script src="js/carrito.js"></script>
<script>
(function () {
  var C = window.SlumenCarrito;
  var lang = C.idioma();
  document.documentElement.lang = lang;
  var es = lang !== "en";
  var $ = function (id) { return document.getElementById(id); };

  var TXT = {
    verificando: [es ? "Un momento" : "One moment", es ? "Estamos confirmando tu pago." : "We’re confirming your payment.", es ? "Respira. Esto toma unos segundos." : "Breathe. This takes a few seconds."],
    aprobado: [es ? "Pago confirmado" : "Payment confirmed", es ? "Gracias por elegirte." : "Thank you for choosing yourself.", ""],
    pendiente: [es ? "Pago en proceso" : "Payment in progress", es ? "Tu pago está en camino." : "Your payment is on its way.", es ? "Algunos medios, como PSE, tardan unos minutos. Apenas se confirme, te llega el acceso al correo." : "Some methods take a few minutes. As soon as it’s confirmed, your access arrives by email."],
    rechazado: [es ? "Pago no completado" : "Payment not completed", es ? "Esta vez el pago no pasó." : "The payment didn’t go through this time.", es ? "No se hizo ningún cobro. Puedes intentarlo de nuevo con el mismo u otro medio de pago." : "You weren’t charged. You can try again with the same or another payment method."],
    desconocido: [es ? "Tu compra" : "Your purchase", es ? "No encontramos tu pago." : "We couldn’t find your payment.", es ? "Si pagaste y no te llega el correo en unos minutos, escríbenos y lo revisamos contigo." : "If you paid and the email doesn’t arrive in a few minutes, write to us and we’ll look into it with you."]
  };

  function boton(texto, href, lleno) {
    var a = document.createElement("a");
    a.className = "boton " + (lleno ? "boton--lleno" : "boton--linea");
    a.href = href; a.textContent = texto;
    return a;
  }

  function mostrar(estado, datos) {
    var x = TXT[estado] || TXT.desconocido;
    $("gracias").dataset.estado = estado;
    $("etiqueta").textContent = x[0];
    $("titulo").textContent = x[1];
    var texto = x[2];
    if (estado === "aprobado" && datos && datos.sinCuenta) {
      texto = es
        ? "Tu pago quedó confirmado. En las próximas horas te enviamos el acceso a tus productos al correo que escribiste."
        : "Your payment was confirmed. Within the next few hours we’ll send your access to the email you entered.";
    } else if (estado === "aprobado" && datos && datos.sesion) {
      texto = es
        ? "Tu cuenta ya está abierta en este dispositivo. Entra ahora a tu producto. También te enviamos un correo" + (datos.email ? " a " + datos.email : "") + " para entrar después desde otro dispositivo."
        : "Your account is already open on this device. Go to your product now. We also emailed you" + (datos.email ? " at " + datos.email : "") + " so you can sign in later from another device.";
    } else if (estado === "aprobado") {
      texto = es
        ? "Tus productos ya están en tu cuenta. También te enviamos un correo" + (datos && datos.email ? " a " + datos.email : "") + " con un botón para entrar sin contraseña."
        : "Your products are already in your account. We also emailed you" + (datos && datos.email ? " at " + datos.email : "") + " a button to sign in without a password.";
    }
    $("texto").textContent = texto;
    var acc = $("acciones"); acc.innerHTML = "";
    if (estado === "rechazado") acc.append(boton(es ? "Intentar de nuevo →" : "Try again →", "checkout.html", true));
    if (estado === "aprobado" && datos && datos.sesion && datos.productos && datos.productos.length === 1) {
      acc.append(boton(es ? "Entrar a mi producto →" : "Open my product →", "/productos/" + encodeURIComponent(datos.productos[0]) + "/", true));
    } else if (estado === "aprobado" && !(datos && datos.sinCuenta)) acc.append(boton(es ? "Ir a mis productos →" : "Go to my products →", "cuenta.html", true));
    if (estado === "aprobado" && datos && datos.whatsapp) {
      var wa = boton(es ? "Guardar mi acceso en WhatsApp" : "Save my access on WhatsApp", datos.whatsapp, false);
      wa.target = "_blank"; wa.rel = "noopener";
      acc.append(wa);
      var nota = document.createElement("p");
      nota.className = "nota-wa";
      nota.textContent = es
        ? "Se abre tu WhatsApp con el mensaje y el enlace a tu producto. Envíatelo para tenerlo siempre a mano."
        : "Your WhatsApp opens with the message and the link to your product. Send it to yourself to keep it handy.";
      acc.append(nota);
    }
    if (estado !== "verificando") acc.append(boton(es ? "Volver a Slumen" : "Back to Slumen", "index.html", estado === "pendiente" || estado === "desconocido"));
    if (estado === "aprobado" || estado === "pendiente") C.vaciar();
  }

  // Cada pasarela vuelve con parámetros distintos.
  var q = new URLSearchParams(location.search);
  var pasarela = null, id = null;
  if (q.get("session_id")) { pasarela = "stripe"; id = q.get("session_id"); }
  else if (q.get("payment_id") || q.get("collection_id")) { pasarela = "mercadopago"; id = q.get("payment_id") || q.get("collection_id"); }
  else if (q.get("token")) { pasarela = "paypal"; id = q.get("token"); }
  else if (q.get("id")) { pasarela = "wompi"; id = q.get("id"); }

  mostrar("verificando");
  if (!pasarela) { mostrar("desconocido"); return; }

  var intentos = 0;
  function consultar() {
    intentos++;
    var miRef = ""; try { miRef = sessionStorage.getItem("slumen-pedido") || localStorage.getItem("slumen-pedido") || ""; } catch (e) {}
    fetch("/api/confirmar?pasarela=" + encodeURIComponent(pasarela) + "&id=" + encodeURIComponent(id) + (miRef ? "&ref=" + encodeURIComponent(miRef) : ""))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.estado === "pendiente" && intentos < 6) { setTimeout(consultar, 4000); return; }
        mostrar(d.estado === "revisar" ? "pendiente" : d.estado, d);
      })
      .catch(function () { if (intentos < 4) setTimeout(consultar, 4000); else mostrar("pendiente"); });
  }
  consultar();
})();
</script>
</body>
</html>
